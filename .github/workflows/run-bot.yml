name: Run SWOP Access Bot

on:
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ACCESS_BOT_TOKEN: ${{ secrets.ACCESS_BOT_TOKEN }}
          ACCESS_GROUP_ID: ${{ secrets.ACCESS_GROUP_ID }}
          ACCESS_DB_PATH: /home/runner/work/swopps/swopps/bot.db
        run: python access_bot.py
