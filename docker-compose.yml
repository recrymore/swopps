version: '3.8'

services:
  gifts-monitor:
    build: .
    container_name: telegram_gifts_monitor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтируем файл сессии Telethon, базу данных и конфиг для сохранения состояния
      - ./userbot.session:/app/userbot.session
      - ./gifts_monitor.db:/app/gifts_monitor.db
      - ./config.yaml:/app/config.yaml
    stdin_open: true
    tty: true
